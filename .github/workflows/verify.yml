name: Verify (simulator)

# Verifies SuperStore with no physical iPhone, on GitHub-hosted macOS runners.
# No local Mac required.
#
# job "build"   - compiles the app for the iOS Simulator. Works today.
# job "promote" - fast-forwards main to develop, but only on a push to develop
#                 whose build succeeded (and whose tests passed, when enabled).
#                 This is the only thing that moves main.
# job "test"   - runs XCTest/XCUITest. Gated OFF because AltStore.xcodeproj
#                currently has NO test targets (only 2 app + 1 extension), the
#                shared scheme references UITests blueprint A8E2DB20... which is
#                not in the project, and SideStore/Tests/SideStoreTests.xctestplan
#                is missing. Turn it on by setting repository variable
#                SUPERSTORE_TESTS_ENABLED=true once the test targets exist.
#
# Cost: macOS runners bill $0.062/min in private repos (GitHub Free includes
# $12/mo, ~194 min). Public repos are free. Triggered only on PRs, pushes to
# develop, and manual dispatch.

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
      - '.editorconfig'
      - '.gitignore'
      - '.github/**'
  push:
    branches: [develop]

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

env:
  XC_PROJECT: AltStore.xcodeproj
  XC_SCHEME: SideStore
  # Release, not Debug: a Debug build carries the placeholder DEVELOPMENT_TEAM
  # in its bundle id ($(BASE_BUNDLE_ID).$(DEVELOPMENT_TEAM)) and is not shippable.
  XC_CONFIG: Release
  DERIVED_DATA: build/derived-data
  RESULT_BUNDLE: build/verify.xcresult
  # Mirrors COMMON_BUILD_SETTINGS in the Makefile
  UNSIGNED_SETTINGS: >-
    CODE_SIGNING_ALLOWED=NO
    CODE_SIGNING_REQUIRED=NO
    AD_HOC_CODE_SIGNING_ALLOWED=YES
    DEVELOPMENT_TEAM=XYZ0123456
    ORG_IDENTIFIER=com.superstore

jobs:
  build:
    name: Build for iOS (unsigned)
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun simctl list runtimes

      - name: Cache SwiftPM + derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}
          key: simbuild-${{ runner.os }}-${{ hashFiles('Dependencies/**/Package.resolved', 'AltStore.xcodeproj/project.pbxproj') }}
          restore-keys: |
            simbuild-${{ runner.os }}-

      # generic/platform=iOS builds the arm64 device slice and needs no signing
      # identity and no connected device. Do not target the simulator here:
      # minimuxer ships no x86_64 slice, so an Intel runner fails to link it.
      - name: Build
        run: |
          set -o pipefail
          xcodebuild build \
            -project "$XC_PROJECT" \
            -scheme "$XC_SCHEME" \
            -config "$XC_CONFIG" \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$DERIVED_DATA" \
            $UNSIGNED_SETTINGS

      # An unsigned .ipa is just Payload/<App>.app zipped up. It cannot be
      # installed as-is: whoever downloads it signs it with their own Apple ID.
      - name: Package unsigned IPA
        run: |
          set -o pipefail
          # Take the app the scheme actually built, not whichever bundle happens
          # to sit next to it (extensions and helpers land in the same folder).
          PRODUCTS="$DERIVED_DATA/Build/Products/$XC_CONFIG-iphoneos"
          APP="$PRODUCTS/SideStore.app"
          if [ ! -d "$APP" ]; then
            APP=$(du -sk "$PRODUCTS"/*.app 2>/dev/null | sort -rn | head -1 | cut -f2-)
          fi
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "no .app was produced" >&2
            ls -la "$PRODUCTS" >&2
            exit 1
          fi
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")
          if [ -z "$EXEC" ] || [ ! -f "$APP/$EXEC" ]; then
            echo "bundle has no executable: $APP" >&2
            exit 1
          fi
          echo "packaging $APP (executable: $EXEC)"
          du -sh "$APP"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry "$GITHUB_WORKSPACE/build/SuperStore.ipa" Payload
          cd "$GITHUB_WORKSPACE"
          ls -lh build/SuperStore.ipa
          unzip -l build/SuperStore.ipa | head -5

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")
          echo "$VERSION" > build/version.txt
          echo "configuration: $XC_CONFIG"
          echo "version: $VERSION"
          echo "bundle id: $BUNDLE_ID"
          if [ "$BUNDLE_ID" != "com.superstore.SuperStore" ]; then
            echo "unexpected bundle id for a release build: $BUNDLE_ID" >&2
            exit 1
          fi

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuperStore-ipa
          path: build/SuperStore.ipa
          if-no-files-found: error
          retention-days: 30

  test:
    name: Run tests on iOS Simulator
    if: ${{ vars.SUPERSTORE_TESTS_ENABLED == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 60
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Toolchain
        run: xcodebuild -version

      # The Makefile hardcodes "iPhone 17 Pro, OS=26.0", which only exists on the
      # Xcode version it was written against. Pick whatever iPhone runtime the
      # runner actually ships so this does not rot on every image update.
      - name: Pick an available iPhone simulator
        id: sim
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          data = json.loads(
              subprocess.check_output(["xcrun", "simctl", "list", "devices", "available", "--json"])
          )
          devices = [
              device
              for runtime, entries in data.get("devices", {}).items()
              if "iOS" in runtime
              for device in entries
              if device.get("isAvailable", True) and device["name"].startswith("iPhone")
          ]
          if not devices:
              sys.exit("No available iPhone simulator runtime found on this runner")

          chosen = devices[0]
          print(f"destination=platform=iOS Simulator,id={chosen['udid']}")
          print(f"device={chosen['name']}")
          PY

      - name: Cache SwiftPM + derived data
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ${{ env.DERIVED_DATA }}
          key: simtest-${{ runner.os }}-${{ hashFiles('Dependencies/**/Package.resolved', 'AltStore.xcodeproj/project.pbxproj') }}
          restore-keys: |
            simtest-${{ runner.os }}-

      - name: Build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project "$XC_PROJECT" \
            -scheme "$XC_SCHEME" \
            -config Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            $UNSIGNED_SETTINGS

      - name: Run tests
        run: |
          set -o pipefail
          rm -rf "$RESULT_BUNDLE"
          xcodebuild test-without-building \
            -project "$XC_PROJECT" \
            -scheme "$XC_SCHEME" \
            -config Debug \
            -destination "${{ steps.sim.outputs.destination }}" \
            -derivedDataPath "$DERIVED_DATA" \
            -enableCodeCoverage YES \
            -resultBundlePath "$RESULT_BUNDLE" \
            $UNSIGNED_SETTINGS

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verify-xcresult
          path: ${{ env.RESULT_BUNDLE }}
          if-no-files-found: warn

  # develop is the integration branch: every push to it is built (and tested, if
  # enabled) before this job moves main. A red build leaves main untouched.
  # Pushing with GITHUB_TOKEN does not start new workflow runs, so this cannot loop.
  promote:
    name: Merge develop into main
    needs: [build, test]
    if: >
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/develop' &&
      needs.build.result == 'success' &&
      (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Fast-forward main to develop
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          sha=$(git ls-remote "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git" refs/heads/develop | cut -f1)
          if [ -z "$sha" ]; then
            echo "could not resolve develop" >&2
            exit 1
          fi
          echo "develop is at $sha"
          curl -sf -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${REPO}/git/refs/heads/main" \
            -d "{\"sha\":\"${sha}\",\"force\":true}"
          echo "main -> $sha"
