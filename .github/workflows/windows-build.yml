name: Build Windows setup

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SuperStore-Setup.exe
    runs-on: windows-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pymobiledevice3

      - name: Check the script parses and reports
        run: |
          python -c "import ast,pathlib; ast.parse(pathlib.Path('windows/superstore_setup.py').read_text(encoding='utf-8'))"
          python windows/superstore_setup.py --cli
          python windows/superstore_setup.py --devices

      - name: Build the executable
        run: |
          pyinstaller --onefile --windowed --name SuperStore-Setup --collect-all pymobiledevice3 --copy-metadata pymobiledevice3 --distpath build --workpath build/work --specpath build windows/superstore_setup.py
          dir build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperStore-Setup-exe
          path: build/SuperStore-Setup.exe
          if-no-files-found: error
