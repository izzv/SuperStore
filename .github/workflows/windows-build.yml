name: Build Windows setup

on:
  workflow_dispatch:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-build.yml'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build SuperStore-Setup.exe
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip pyinstaller pymobiledevice3 requests certifi cryptography ipasign

      - name: Check the script parses and reports
        run: |
          python -c "import ast,pathlib; ast.parse(pathlib.Path('windows/superstore_setup.py').read_text(encoding='utf-8'))"
          python windows/superstore_setup.py --cli
          python windows/superstore_setup.py --devices

      - name: Build the executable
        run: |
          pyinstaller --onefile --windowed --name SuperStore-Setup --icon "${{ github.workspace }}/windows/SuperStore.ico" --splash "${{ github.workspace }}/windows/splash.png" --add-data "${{ github.workspace }}/windows/splash.png;." --add-data "${{ github.workspace }}/windows/SuperStore.ico;." --add-data "${{ github.workspace }}/windows/apple-root-ca.pem;." --paths "${{ github.workspace }}/windows" --collect-all pymobiledevice3 --collect-all ipasign --collect-data certifi --copy-metadata pymobiledevice3 --distpath build --workpath build/work --specpath build windows/superstore_setup.py
          dir build

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: SuperStore-Setup-exe
          path: build/SuperStore-Setup.exe
          if-no-files-found: error

      - name: Publish the setup as a release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-setup
          name: SuperStore Setup for Windows
          body: |
            The Windows helper that pairs an iPhone over USB, writes its pairing
            file and installs SuperStore.

            This release holds a single asset that is replaced by every build, so
            the link below always downloads the newest one.
          files: build/SuperStore-Setup.exe
          fail_on_unmatched_files: true
          make_latest: false
